name: Sync Global Exchanges Ledger

on:
  schedule:
    - cron: "0 */2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-exchanges:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and update master CSV
        env:
          PYTHONPATH: .
        run: python -c "from src.data_engine import execute_live_ingestion; df = execute_live_ingestion(); print(f'Updated {len(df)} rows successfully.')"

      - name: Commit and push updated master CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/global_exchanges_master.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update global_exchanges_master.csv"
          git push
