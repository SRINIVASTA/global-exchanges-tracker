name: Sync Global Exchanges Ledger

on:
  schedule:
    - cron: "30 11 * * 2-5" # Runs Tuesday to Friday at 11:30 UTC (5:00 PM IST)

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-exchanges:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run headless ingestion & email dispatch
        env:
          PYTHONPATH: .
          USERNAME: ${{ secrets.USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python cron_job.py

      - name: Commit and push updated master CSV
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add data/global_exchanges_master.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update global_exchanges_master.csv"
          git push
